<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="Mannings Media - Client Gallery">
  <meta name="theme-color" content="#206a9c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <title>My Gallery | Mannings Media</title>
  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/fontawesome.css">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/owl.css">
  <link rel="stylesheet" href="assets/css/animate.css">
  <link rel="stylesheet" href="https://unpkg.com/swiper@7/swiper-bundle.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css">
</head>

<body>

  <div id="js-preloader" class="js-preloader">
    <div class="preloader-inner">
      <div class="preloader-logo"><img src="assets/images/logo.png" alt="Mannings Media"></div>
      <div class="preloader-bar"><span class="preloader-progress"></span></div>
    </div>
  </div>

  <header class="header-area">
    <div class="container">
      <div class="row">
        <div class="col-12">
          <nav class="main-nav" aria-label="Main navigation">
            <a href="index.html" class="logo"><img src="assets/images/logo.png" alt="Mannings Media Logo"></a>
            <ul class="nav" role="menubar">
              <li><a href="index.html">Home</a></li>
              <li><a href="ourwork.html">Our Work</a></li>
              <li><a href="services.html">Services</a></li>
              <li><a href="projects.html">Projects</a></li>
              <li><a href="about.html">About</a></li>
              <li class="nav-account"><a href="client.html" aria-label="Client Portal"><i class="fa fa-user-circle"></i></a></li>
            </ul>
            <button class="menu-trigger" aria-label="Toggle menu"><span></span><span></span><span></span></button>
          </nav>
        </div>
      </div>
    </div>
  </header>

  <div id="template-content">
    <section class="page-header">
      <div class="container"><div class="row"><div class="col-lg-12 text-center py-5">
        <i class="fa fa-spinner fa-spin" style="font-size:48px;color:#44bbc5;"></i>
        <h2 style="margin-top:20px;">Loading Your Gallery</h2>
      </div></div></div>
    </section>
  </div>

  <footer class="footer">
    <div class="container">
      <div class="row">
        <div class="col-lg-5"><div class="footer-brand"><img src="assets/images/logo.png" class="footer-logo"><p>Full-service creative agency.</p></div></div>
        <div class="col-lg-2"><div class="footer-links"><h4>Links</h4><ul><li><a href="index.html">Home</a></li><li><a href="ourwork.html">Our Work</a></li><li><a href="client.html">Portal</a></li></ul></div></div>
        <div class="col-lg-2"><div class="footer-links"><h4>Services</h4><ul><li><a href="#">Photography</a></li><li><a href="#">Videography</a></li><li><a href="#">Design</a></li></ul></div></div>
        <div class="col-lg-3"><div class="footer-contact"><h4>Contact</h4><ul><li><i class="fa fa-envelope"></i> hello@manningsmedia.com</li></ul></div></div>
      </div>
      <div class="row"><div class="col-lg-12"><div class="footer-bottom"><p>&copy; <span id="current-year"></span> Mannings Media.</p></div></div></div>
    </div>
  </footer>

  <script src="vendor/jquery/jquery.min.js"></script>
  <script src="vendor/bootstrap/js/bootstrap.min.js"></script>
  <script src="assets/js/custom.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/js/lightbox.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      document.getElementById('current-year').textContent = new Date().getFullYear();
      
      document.querySelector('.menu-trigger').addEventListener('click', function() {
        this.classList.toggle('active');
        document.querySelector('.main-nav .nav').classList.toggle('active');
      });
      
      window.addEventListener('scroll', function() {
        document.querySelector('.header-area').classList.toggle('header-sticky', window.scrollY > 100);
      });

      const slug = new URLSearchParams(window.location.search).get('client');
      if (!slug) return showError('No client specified.');
      
      try {
        const res = await fetch('clients/' + slug + '/config.json');
        if (!res.ok) return showError('Gallery not found.');
        
        const config = await res.json();
        if (config.access?.expires && new Date() > new Date(config.access.expires)) {
          return showError('Gallery has expired.');
        }
        
        const base = 'clients/' + slug + '/images/';
        const images = config.gallery.images.map(f => base + f);
        const cover = config.client?.coverImage ? base + config.client.coverImage : images[0];
        
        if (!images.length) return showError('No images found.');
        
        buildGallery(config, images, cover);
      } catch(e) {
        showError('Unable to load gallery.');
      }
      
      setTimeout(() => document.getElementById('js-preloader').classList.add('loaded'), 500);
    });
    
    function buildGallery(config, images, cover) {
      let cards = '';
      images.forEach((img, i) => {
        cards += `<div class="col-lg-3 col-md-4 col-sm-6 gallery-item">
          <div class="wedding-photo-card">
            <a href="${img}" data-lightbox="wedding" data-title="Photo ${i+1}">
              <img src="${img}" alt="Photo ${i+1}" loading="lazy" onerror="this.closest('.gallery-item').remove()">
              <div class="photo-overlay"><i class="fa fa-heart"></i></div>
            </a>
          </div></div>`;
      });
      
      document.getElementById('template-content').innerHTML = `
        <section class="wedding-hero">
          <div class="wedding-hero-image">
            <img src="${cover}" alt="${config.client.name}" onerror="this.src='${images[0]}'">
            <div class="wedding-hero-overlay"></div>
            <div class="wedding-hero-content">
              <span class="wedding-badge"><i class="fa fa-heart"></i> ${config.client.type}</span>
              <h1>${config.client.name}</h1>
              <p>${config.client.description}</p>
              <div class="wedding-meta">
                <span><i class="fa fa-calendar"></i> ${config.client.date}</span>
                <span><i class="fa fa-map-marker"></i> ${config.client.location}</span>
                <span><i class="fa fa-camera"></i> ${config.client.photographer}</span>
              </div>
            </div>
          </div>
        </section>
        <section class="wedding-gallery"><div class="container">
          <div class="gallery-intro text-center">
            <span class="section-badge">Our Story</span>
            <h2>A Day to <span class="gradient-text">Remember</span></h2>
            <p>Every precious moment captured forever</p>
          </div>
          <div class="gallery-controls">
            <button class="view-btn active" data-view="grid"><i class="fa fa-th"></i></button>
            <button class="view-btn" data-view="masonry"><i class="fa fa-th-large"></i></button>
            <span class="photo-count">${images.length} photos</span>
          </div>
          <div class="row gallery-grid" id="wedding-gallery">${cards}</div>
          <div class="text-center mt-5">
            <button class="btn btn-primary btn-lg" id="download-all"><i class="fa fa-download"></i> Download All Photos</button>
          </div>
        </div></section>`;
      
      document.querySelectorAll('.view-btn').forEach(b => {
        b.addEventListener('click', function() {
          document.querySelectorAll('.view-btn').forEach(x => x.classList.remove('active'));
          this.classList.add('active');
          document.getElementById('wedding-gallery').parentElement.className = 
            this.dataset.view === 'grid' ? 'row gallery-grid' : 'row gallery-masonry';
        });
      });
      
      document.getElementById('download-all').addEventListener('click', async function() {
        const btn = this, orig = btn.innerHTML;
        btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Creating ZIP...';
        btn.disabled = true;
        
        const zip = new JSZip(), folder = zip.folder(config.download?.zipName || 'Photos');
        let n = 0;
        for (let i = 0; i < images.length; i++) {
          try {
            const r = await fetch(images[i]);
            if (r.ok) { folder.file('photo-' + String(i+1).padStart(3,'0') + '.jpg', await r.blob()); n++; }
          } catch(e) {}
        }
        
        if (n > 0) {
          saveAs(await zip.generateAsync({type:'blob'}), (config.download?.zipName||'Photos')+'.zip');
          btn.innerHTML = '<i class="fa fa-check"></i> Downloaded ' + n + ' photos!';
        } else {
          btn.innerHTML = '<i class="fa fa-exclamation-triangle"></i> Failed';
        }
        setTimeout(() => { btn.innerHTML = orig; btn.disabled = false; }, 3000);
      });
    }
    
    function showError(m) {
      document.getElementById('template-content').innerHTML = `
        <section class="page-header"><div class="container"><div class="row"><div class="col-lg-12 text-center py-5">
          <i class="fa fa-exclamation-circle" style="font-size:48px;color:#999;"></i>
          <h2 style="margin-top:20px;">Access Restricted</h2><p>${m}</p>
          <a href="client.html" class="btn btn-primary mt-4">Back to Login</a>
        </div></div></div></section>`;
      document.getElementById('js-preloader').classList.add('loaded');
    }
  </script>
</body>
</html>
